<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis primeras tablas</title>
    <style>
        table,
        td,
        th,
        tr {
            border: 1px solid red;
            margin: 20px;
        }

</head>

                        <th>3</th>
                    </tr>
                    <tr>
                        <th>1</th>

                        <th>3</th>
                    </tr>
                    <tr>
                        <th>1</th>
                        <th>2</th>
                        <th>2</th>
                    </tr>
                </table>
            </th>
        </tr>
        <tr>
            <th>1</th>

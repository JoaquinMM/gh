<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <style>
    .verde{
        color:#21a121;
        font-family:Arial, Helvetica, sans-serif;
    }
    .azul{
        color:#2020af;
        font-family:'Courier New', Courier, monospace;
    }
    .rojo{
        color:#ff0000;
        font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }
    .encabezado{
        color:#2020af;
    }
    p{
        font-size:30px;
        font-weight:bold;
    }
    </style>

</head>
<body>
    <h1 class="encabezado">Empezando con CSS</h1>
    <p class="verde">Color verde</p>
    <p class="azul">Color azul</p>
    <p class="rojo">Color rojo</p>
    <div style="border:2px dotted blue; padding: 50px; margin 50px">Primer bloques</div>
    <div style="border: 5px dashed red; padding-top: 200px;"></div>

    
</body>
</html>

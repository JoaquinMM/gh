<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .principal{
            border:1px solid blue;
            width:1000px;
            height:1000px;
            position:fixed;
        }
        .izquierda{
            position:fixed;
            border:1px solid blue;
            left:2px;
            top:2px;
            width:50px;
            height:50px;
        }
        .derecha{
            position:fixed;
            border:1px solid blue;
            right:2px;
            top:2px;
            width:50px;
            height:50px;

        }
        .a_izquierda{
            position:fixed;
            border:1px solid blue;
            left:2px;
            bottom:2px;
            width:50px;
            height:50px;

        }
        .a_derecha{
            position:fixed;
            border:1px solid blue;
            right:2px;
            bottom:2px;
            width:50px;
            height:50px;

        }
    </style>
</head>
<body>
    <div class="principal">
        <div class="izquierda">
            hola
        </div>
         <div class="derecha">
            hola
        </div>
         <div class="a_izquierda">
            hola
        </div>
         <div class="a_derecha">
            hola
        </div>
    </div>
    
</body>
</html>

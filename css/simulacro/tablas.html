<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <style>
        .tabla{
            border:1px solid black;
            width:70px;
            height:70px;
        }
        .tabla2{
            border:1px solid black;
            width:50px;
            height:50px;
        }
        .tabla2{
            border:1px solid black;

        }
        td{
            border:1px solid black;
        }
    </style>
</head>
<body>
    <table class="tabla">
        <tr>
            <td>
                <table class="tabla2">
                    <tr>
                        <td>A1</td>
                        <td>A2</td>
                        <td>A3</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>
                <table class="tabla3">
                    <tr>
                        <td>B1</td>
                    </tr>
                    <tr>
                        <td>B2</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extraordinaria</title>
    <style>
        .fondo{
            background-image: url(../practica06/img/fondo.jpg);
        }
        h1{
            color:blue;
        }
        h2{
            color:green;
        }
        div{
            border:2px solid blue;
        }
        p{
            font-size:16px;
        }
        .tabla{
            border:1px solid black;
            width:100px;
            height:100px;
        }
        td{
            border:1px solid black;
        }
        th{
            border:1px solid black;
        }
       

    </style>
</head>
<body class="fondo">
    <h1>Este es mi examen</h1>
    <p><a href="www.vedoque.com">Esta es una buena pagina</a></p>
        <img src="../practica06/img/paisaje.webp" height="100px"/>
        <figcaption>Esta es una gran imagen</figcaption>
        <h2 style="background-color: white">El examen esta siendo facil</h2>
    <p>No esperaba que fuera tan facil</p>
    <table class="tabla">
        <tr>
            <td>Nombre</td>
            <th>Jose</th>
            <th>Pablo</th>
            <th>Antonio</th>
        </tr>
        <tr>
            <td>Nota</td>
            <th>7</th>
            <th>5</th>
            <th>4</th>
        </tr>
    </table>
    <footer>Hoy si que voy a aprobar</footer>
    <form>
        <fieldset>
            <legend>Formulario</legend>
        <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre">
      <br>
      <br>
      <label for="ciclo">Ciclo:</label>
      <select id="ciclo" name="ciclo" required>
        <option value="ASIR">ASIR</option>
        <option value="DAM">DAM</option>
        <option value="DAW">DAW</option>
      </select>
      <br>
      <br>
      <label>
        <input type="radio" name="curso" value="1" required> Primero
      </label>
      <br>
      <label>
        <input type="radio" name="curso" value="2"> Segundo
      </label>
      <br>
      <br>
      <label>
        <input type="checkbox" name="estudios_previos" value="bachillerato"> Bachillerato
      </label>
      <label>
        <input type="checkbox" name="estudios_previos" value="smr"> SMR
      </label>
      </fieldset>

    </form>

    
</body>
</html>
